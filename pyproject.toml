[project]
name = "equity-research"
version = "0.1.0"
description = "Personal equity-research workbench for Indian stocks (NSE/BSE) from primary/official sources."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Aaryan Nakhat" }]
dependencies = [
    "scrapling[fetchers]>=0.4",
    "duckdb>=1.0",
    "pandas>=2.2",
    "lxml>=5.0",
    "litellm>=1.100",         # provider-agnostic LLM access (any provider, chosen via .env)
    "markdown>=3.10.2",
    "imapclient>=3.0",
    "matplotlib>=3.9",
    "openpyxl>=3.1.5",
    "cryptography>=50.0.1",
    "pypdf>=5.0",             # validate filing PDFs before the LLM reads them (drop broken docs)
]

[project.optional-dependencies]
# Extra SDKs some LiteLLM providers need for service-account / cloud auth — install only if the
# model you configure in .env requires it (API-key providers need nothing beyond the base install).
cloud = ["google-cloud-aiplatform>=1.70"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_research"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
